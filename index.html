function randomizePanel(which){
  if (which === 'rotation'){
    ctl.rot_distance.set(rndRange05(15,60));
    ctl.rot_height.set(rndRange05(-8,15));
    ctl.rot_speed.set(rndRange05(3,12));
    ctl.rot_vwander.set(rndRange05(4,20));
    ctl.rot_passmax.set(rndRange05(30,120));
    ctl.rot_passper.set(rndRange05(10,40));
    ctl.rot_offx.set(rndRange05(-25,25));
    ctl.rot_offy.set(rndRange05(-8,10));
    ctl.rot_offz.set(rndRange05(-10,10));
    if (window.__syncOrbitPad) window.__syncOrbitPad();
    if (window.__syncPassPad) window.__syncPassPad();
  } else if (which === 'fixed'){
    ctl.fix_distance.set(rndRange05(FIX_MAX_DISTANCE*0.3,FIX_MAX_DISTANCE));
    ctl.fix_azimuth.set(rndRange05(0,359));
    ctl.fix_elev.set(rndRange05(-15,25));
    ctl.fix_drift.set(rndRange05(1,9));
    if (window.__syncFixedPad) window.__syncFixedPad();
  } else if (which === 'aircraft'){
    ctl.air_distance.set(rndRange05(4,20));
    ctl.air_azimuth.set(rndRange05(0,359));
    ctl.air_elev.set(rndRange05(-20,40));
    if (window.__syncAircraftPad) window.__syncAircraftPad();
  } else if (which === 'shake'){
    ctl.sh_dist.set(rndRange05(0.05,0.6));
    ctl.sh_yaw.set(rndRange05(2,10));
    ctl.sh_pitch.set(rndRange05(2,9));
    ctl.sh_roll.set(rndRange05(1,7));
  }
}

const PANEL_CONTROL_KEYS = {
  rotation: ['rot_distance','rot_height','rot_speed','rot_vwander','rot_passmax','rot_passper','rot_offx','rot_offy','rot_offz'],
  fixed: ['fix_distance','fix_azimuth','fix_elev','fix_drift'],
  aircraft: ['air_distance','air_azimuth','air_elev'],
  shake: ['sh_hz','sh_dist','sh_yaw','sh_pitch','sh_roll']
};
const PANEL_CHECKBOXES = {
  rotation: [{id:'rot_orbit_follow', def:true}, {id:'rot_pass_follow', def:false}],
  fixed: [{id:'fix_follow', def:true}],
  aircraft: [{id:'air_transparent', def:false}],
  shake: []
};

function resetPanel(which){
  (PANEL_CONTROL_KEYS[which]||[]).forEach(k=>{ if (ctl[k]) ctl[k].reset(); });
  (PANEL_CHECKBOXES[which]||[]).forEach(c=>{ const el=$(c.id); if (el) el.checked = c.def; });
  if (which === 'fixed' && window.__syncFixedPad) window.__syncFixedPad();
  if (which === 'aircraft' && window.__syncAircraftPad) window.__syncAircraftPad();
  if (which === 'rotation'){
    if (window.__syncOrbitPad) window.__syncOrbitPad();
    if (window.__syncPassPad) window.__syncPassPad();
  }
}

/* ---- Step 1: file load ---- */
function setStepDone(n){ $('num'+n).classList.add('done'); $('num'+n).textContent='\u2713'; }
function enableStep(n){ $('body'+n).classList.remove('disabled'); }

/* ---- File System Access API support (Chromium browsers only) ---- */
const FSA_SUPPORTED = typeof window.showSaveFilePicker === 'function';
let INPUT_FILE_HANDLE = null;   // FileSystemFileHandle for the opened .yfs, if the browser gave us one
let CUSTOM_SAVE_HANDLE = null;  // FileSystemFileHandle chosen via the "Browse" button

function handleFile(file, handle){
  const msg = $('loadMsg');
  msg.classList.remove('err');
  if (!file){ return; }
  INPUT_FILE_HANDLE = handle || null;
  updateSaveLocAvailability(true);
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const text = reader.result;
      PARSED = parseYFS(text);
      PARSED.__fileBaseName = file.name.replace(/\.yfs$/i,'');
      if (PARSED.airplanes.length === 0){
        msg.textContent = t('msgNoAirplane');
        msg.classList.add('err');
        return;
      }
      msg.textContent = t('msgLoaded', {file:file.name, count:PARSED.airplanes.length});
      setStepDone(1);
      populateStep2();
      enableStep(2); enableStep(3); enableStep(4);
    }catch(e){
      msg.textContent = t('msgLoadError', {err:e.message});
      msg.classList.add('err');
      console.error(e);
    }
  };
  reader.onerror = ()=>{ msg.textContent = t('msgReadError'); msg.classList.add('err'); };
  reader.readAsText(file, 'utf-8');
}

function populateStep2(){
  const sel = $('targetSelect');
  sel.innerHTML = '';
  PARSED.airplanes.forEach(ap=>{
    const opt = document.createElement('option');
    opt.value = ap.index; opt.textContent = t('optRecords', {label:ap.label, count:ap.count});
    sel.appendChild(opt);
  });
  sel.selectedIndex = 0;
  TARGET_IDX = 0;
  populateMountSelect();
  sel.addEventListener('change', ()=>{
    TARGET_IDX = parseInt(sel.value,10);
    populateMountSelect();
  });
}

function populateMountSelect(){
  const sel = $('mountSelect');
  sel.innerHTML = '';
  PARSED.airplanes.forEach(ap=>{
    if (ap.index === TARGET_IDX) return;
    const opt = document.createElement('option');
    opt.value = ap.index; opt.textContent = ap.label;
    sel.appendChild(opt);
  });
  if (sel.options.length === 0){
    const opt = document.createElement('option');
    opt.value = TARGET_IDX; opt.textContent = t('optSameAsTarget', {label:PARSED.airplanes[TARGET_IDX].label});
    sel.appendChild(opt);
  }
}

/* ---- dropzone wiring ---- */
function initDropzone(){
  const dz = $('dropzone'), input = $('fileInput');
  dz.addEventListener('click', async ()=>{
    if (typeof window.showOpenFilePicker === 'function'){
      try{
        const [handle] = await window.showOpenFilePicker({
          types: [{description:'YSFLIGHT replay', accept:{'text/plain':['.yfs']}}],
          excludeAcceptAllOption:false
        });
        const file = await handle.getFile();
        handleFile(file, handle);
        return;
      }catch(e){
        if (e && e.name === 'AbortError') return; // user cancelled the picker
        // fall through to classic input on unexpected errors
      }
    }
    input.click();
  });
  input.addEventListener('change', ()=>{ if(input.files[0]) handleFile(input.files[0], null); });
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', async e=>{
    const item = e.dataTransfer.items && e.dataTransfer.items[0];
    if (item && typeof item.getAsFileSystemHandle === 'function'){
      try{
        const handle = await item.getAsFileSystemHandle();
        if (handle && handle.kind === 'file'){
          const file = await handle.getFile();
          handleFile(file, handle);
          return;
        }
      }catch(err){ /* fall through to plain File */ }
    }
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f, null);
  });
}

/* ---- Step 4: save-location controls ---- */
function updateSaveLocAvailability(fromFileLoad){
  const samePill = document.querySelector('#saveLocPills .pill-sub[data-loc="same"]');
  const msg = $('saveLocMsg');
  const currentlyOnSame = window.__getSaveLocMode && window.__getSaveLocMode() === 'same';
  if (!FSA_SUPPORTED){
    samePill.classList.add('disabled');
    msg.textContent = t('fsaUnsupported');
    if (fromFileLoad && currentlyOnSame && window.__forceSaveLocMode) window.__forceSaveLocMode('custom');
    return;
  }
  if (!INPUT_FILE_HANDLE){
    samePill.classList.add('disabled');
    msg.textContent = t('fsaNoHandle');
    if (fromFileLoad && currentlyOnSame && window.__forceSaveLocMode) window.__forceSaveLocMode('custom');
  } else {
    samePill.classList.remove('disabled');
    msg.textContent = '';
  }
}

function initSaveLoc(){
  let saveLocMode = 'same';
  wirePills('saveLocPills','data-loc', (v)=>{
    if (v==='same' && (!FSA_SUPPORTED || !INPUT_FILE_HANDLE)) { // ignore disabled selection
      document.querySelector('#saveLocPills .pill-sub[data-loc="custom"]').classList.add('active');
      document.querySelector('#saveLocPills .pill-sub[data-loc="same"]').classList.remove('active');
      saveLocMode = 'custom';
      return;
    }
    saveLocMode = v;
    $('saveLocCustomRow').style.display = (v==='custom') ? 'flex' : 'none';
  }, '.pill-sub');
  window.__getSaveLocMode = ()=>saveLocMode;
  window.__forceSaveLocMode = (v)=>{
    document.querySelectorAll('#saveLocPills .pill-sub').forEach(p=>p.classList.remove('active'));
    const target = document.querySelector('#saveLocPills .pill-sub[data-loc="'+v+'"]');
    if (target) target.classList.add('active');
    saveLocMode = v;
    $('saveLocCustomRow').style.display = (v==='custom') ? 'flex' : 'none';
  };
  // "same" starts as the default, but the custom (path) row only makes
  // sense once "custom" is actually selected -- keep it hidden until then.
  $('saveLocCustomRow').style.display = 'none';

  const browseBtn = $('saveLocBrowseBtn');
  if (!FSA_SUPPORTED){
    browseBtn.disabled = true;
    browseBtn.style.opacity = '0.4';
    browseBtn.style.cursor = 'not-allowed';
  }
  browseBtn.addEventListener('click', async ()=>{
    if (!FSA_SUPPORTED) return;
    try{
      const suggested = (PARSED && PARSED.__fileBaseName ? PARSED.__fileBaseName : 'replay') + '_' + dateSuffix() + '.yfs';
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [{description:'YSFLIGHT replay', accept:{'text/plain':['.yfs']}}]
      });
      CUSTOM_SAVE_HANDLE = handle;
      $('saveLocPath').value = handle.name;
    }catch(e){
      if (e && e.name === 'AbortError') return;
      console.error(e);
    }
  });
  updateSaveLocAvailability();
}

/* ---- Step 4: generate ---- */
function log(msg, cls){
  const el = $('log');
  el.style.display='block';
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function generate(){
  $('log').innerHTML=''; $('log').style.display='none';
  if (!PARSED){ log(t('logNeedFile'),'l-err'); return; }

  const target = PARSED.airplanes[TARGET_IDX];
  const cameraType = window.__getCameraType();
  const soundType = window.__getSound();
  log(t('logTarget', {label:target.label}));
  log(t('logCameraType', {type:cameraType}));

  const params = {
    seed: Math.floor(rnd()*1e9),
    sample_hz: ctl.sh_hz.get(),
    rot_style: window.__getRotStyle(),
    rot_orbit_dir: window.__getOrbitDir(),
    rot_distance: ctl.rot_distance.get(),
    rot_height: ctl.rot_height.get(),
    rot_speed: ctl.rot_speed.get(),
    rot_vwander: ctl.rot_vwander.get(),
    rot_orbit_follow_attitude: $('rot_orbit_follow').checked,
    rot_passmax: ctl.rot_passmax.get(),
    rot_passper: ctl.rot_passper.get(),
    rot_offx: ctl.rot_offx.get(),
    rot_offy: ctl.rot_offy.get(),
    rot_offz: ctl.rot_offz.get(),
    rot_pass_follow_attitude: $('rot_pass_follow').checked,
    fix_distance: ctl.fix_distance.get(),
    fix_azimuth: ctl.fix_azimuth.get(),
    fix_elev: ctl.fix_elev.get(),
    fix_drift: ctl.fix_drift.get(),
    fix_follow_attitude: $('fix_follow').checked,
    air_distance: ctl.air_distance.get(), air_azimuth: ctl.air_azimuth.get(), air_elev: ctl.air_elev.get(),
    sh_dist: ctl.sh_dist.get(), sh_yaw: ctl.sh_yaw.get(), sh_pitch: ctl.sh_pitch.get(), sh_roll: ctl.sh_roll.get(),
  };

  let mountTrack = null, mountAp = null;
  if (cameraType === 'aircraft'){
    const mountIdx = parseInt($('mountSelect').value,10);
    mountAp = PARSED.airplanes[mountIdx];
    mountTrack = {times:mountAp.times, pos:mountAp.pos};
    log(t('logMount', {label:mountAp.label}));
  }

  let result;
  try{
    result = computeCameraTrack(target, cameraType, params, mountTrack);
  }catch(e){
    log(t('logCameraCalcError', {err:e.message}), 'l-err');
    console.error(e);
    return;
  }
  const {times:camTimes, track} = result;
  log(t('logFramesComputed', {count:track.length, hz:params.sample_hz}),'l-ok');

  const identifyName = soundType==='jet' ? '<<CAMERA>>' : '<<CAMERA-P>>';
  const newId = PARSED.maxId + 1;
  const blockText = buildAirplaneBlock(identifyName, PARSED.lines[target.headerStart+1], newId, track, camTimes, PARSED.eol);
  log(t('logBlockCreated', {id:newId, name:identifyName}),'l-ok');

  let transparentEdit = null;
  if (cameraType==='aircraft' && $('air_transparent').checked && mountAp){
    transparentEdit = {headerStart: mountAp.headerStart, newName: identifyName};
    log(t('logMountTransparent', {name1:mountAp.name, name2:identifyName}),'l-warn');
  }

  const outText = assembleOutput(PARSED, blockText, transparentEdit);
  const suffix = dateSuffix();
  const baseName = (PARSED.__fileBaseName || 'replay') + '_' + suffix + '.yfs';

  const saveMode = window.__getSaveLocMode ? window.__getSaveLocMode() : 'custom';
  let wroteViaFSA = false;

  if (FSA_SUPPORTED && saveMode === 'same' && INPUT_FILE_HANDLE){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: baseName,
        startIn: INPUT_FILE_HANDLE,
        types: [{description:'YSFLIGHT replay', accept:{'text/plain':['.yfs']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(outText);
      await writable.close();
      wroteViaFSA = true;
      log(t('logSaved', {name:handle.name}),'l-ok');
    }catch(e){
      if (e && e.name === 'AbortError'){ log(t('logSaveCancelled'),'l-warn'); return; }
      log(t('logSaveFallback', {err:e.message}),'l-warn');
    }
  } else if (FSA_SUPPORTED && saveMode === 'custom' && CUSTOM_SAVE_HANDLE){
    try{
      const writable = await CUSTOM_SAVE_HANDLE.createWritable();
      await writable.write(outText);
      await writable.close();
      wroteViaFSA = true;
      log(t('logSaved', {name:CUSTOM_SAVE_HANDLE.name}),'l-ok');
    }catch(e){
      log(t('logSaveCustomFallback', {err:e.message}),'l-warn');
    }
  }

  if (!wroteViaFSA){
    const blob = new Blob([outText], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = baseName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    log(t('logDownloading', {name:baseName}),'l-ok');
  }

  setStepDone(4);
  log(t('logDone', {name:baseName}),'l-ok');
}

/* ---- boot ---- */
document.addEventListener('DOMContentLoaded', ()=>{
  applyI18n();
  initControls();
  initDropzone();
  initSaveLoc();
  $('generateBtn').addEventListener('click', generate);
});

})();

</script>
</body>
</html>
